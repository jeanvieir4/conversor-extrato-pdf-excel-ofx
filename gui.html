<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Conversor de Extratos</title>
<style>
  @font-face {
    font-family: 'IBM Plex Sans Local';
    src: local('IBM Plex Sans'), local('Segoe UI');
  }
  :root{
    --paper: #eef2e9;
    --paper-raised: #f6f8f2;
    --rule: #c7d3bd;
    --rule-strong: #9fb090;
    --ink: #1e2a1f;
    --ink-soft: #52604f;
    --ink-faint: #7c8878;
    --credit: #1f6b46;
    --credit-bg: #dcebe0;
    --debit: #a13a2c;
    --debit-bg: #f3ddd6;
    --sans: 'Segoe UI', -apple-system, sans-serif;
    --mono: 'Consolas', 'SF Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
  }

  header{
    padding: 1rem 1.5rem 0.9rem;
    border-bottom: 2px solid var(--rule-strong);
    flex: none;
  }
  header h1{
    margin: 0;
    font-size: 1.3rem;
    font-weight: 700;
  }
  header p{
    margin: 0.25rem 0 0;
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  main{
    flex: 1;
    padding: 1.25rem 1.5rem;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-height: 0;
  }

  /* ---------- drop zone ---------- */
  .dropzone{
    border: 2px dashed var(--rule-strong);
    border-radius: 8px;
    background: var(--paper-raised);
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    flex: none;
  }
  .dropzone:hover, .dropzone.dragover{
    border-color: var(--credit);
    background: var(--credit-bg);
  }
  .dropzone .icone{
    font-size: 2rem;
    line-height: 1;
    margin-bottom: 0.5rem;
    color: var(--ink-faint);
  }
  .dropzone .titulo{
    font-weight: 600;
    color: var(--ink);
  }
  .dropzone .sub{
    color: var(--ink-faint);
    font-size: 0.8rem;
    margin-top: 0.3rem;
  }

  /* ---------- lista de arquivos ---------- */
  .lista-arquivos{
    border: 1px solid var(--rule-strong);
    border-radius: 6px;
    background: var(--paper-raised);
    overflow: hidden;
    flex: none;
  }
  .lista-arquivos[hidden]{ display: none; }
  .lista-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0.8rem;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--rule);
  }
  .lista-header button{
    background: none;
    border: none;
    color: var(--ink-faint);
    font-size: 0.75rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .item-arquivo{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0.8rem;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 0.82rem;
  }
  .item-arquivo:last-child{ border-bottom: none; }
  .item-arquivo .remover{
    background: none;
    border: none;
    color: var(--debit);
    cursor: pointer;
    font-size: 0.95rem;
    padding: 0 0.3rem;
    line-height: 1;
  }

  /* ---------- botao converter ---------- */
  .btn-converter{
    flex: none;
    background: var(--credit);
    color: var(--paper-raised);
    border: none;
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn-converter:disabled{
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-converter:not(:disabled):hover{ opacity: 0.9; }

  /* ---------- resultados ---------- */
  .resultados{ flex: none; }
  .resultados[hidden]{ display: none; }
  .resultado-item{
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--rule);
    font-size: 0.85rem;
  }
  .resultado-item:last-child{ border-bottom: none; }
  .status-pill{
    flex: none;
    width: 1.3rem;
    height: 1.3rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    margin-top: 0.05rem;
  }
  .status-pill.ok{ background: var(--credit-bg); color: var(--credit); }
  .status-pill.erro{ background: var(--debit-bg); color: var(--debit); }
  .resultado-texto .nome{
    font-family: var(--mono);
    color: var(--ink);
  }
  .resultado-texto .detalhe{
    color: var(--ink-soft);
    font-size: 0.8rem;
    margin-top: 0.1rem;
  }
  .resultado-texto .detalhe.erro{ color: var(--debit); }

  .resumo-final{
    margin-top: 0.6rem;
    padding-top: 0.6rem;
    border-top: 2px solid var(--rule-strong);
    font-weight: 600;
    font-size: 0.9rem;
  }

  /* ---------- estado processando ---------- */
  .processando{
    display: flex;
    align-items: center;
    gap: 0.6rem;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  .processando[hidden]{ display: none; }
  .spinner{
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--rule-strong);
    border-top-color: var(--credit);
    border-radius: 50%;
    animation: girar 0.7s linear infinite;
  }
  @keyframes girar{ to{ transform: rotate(360deg); } }

  footer{
    flex: none;
    padding: 0.6rem 1.5rem;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: var(--ink-faint);
  }
  footer a{ color: var(--credit); text-decoration: none; }
  footer a:hover{ text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>Conversor de Extratos</h1>
  <p>PDF de banco vira Excel e OFX &mdash; offline, sem digitar nada.</p>
</header>

<main>
  <div class="dropzone" id="dropzone">
    <div class="icone">&#128194;</div>
    <div class="titulo">Arraste os PDFs aqui ou clique pra escolher</div>
    <div class="sub">Pode selecionar mais de um extrato de uma vez</div>
  </div>

  <div class="lista-arquivos" id="listaArquivos" hidden>
    <div class="lista-header">
      <span id="contagemArquivos">0 arquivo(s)</span>
      <button id="btnLimpar" type="button">limpar tudo</button>
    </div>
    <div id="itensArquivos"></div>
  </div>

  <button class="btn-converter" id="btnConverter" disabled>Converter</button>

  <div class="processando" id="processando" hidden>
    <div class="spinner"></div>
    <span>Processando, pode levar alguns segundos...</span>
  </div>

  <div class="resultados" id="resultados" hidden>
    <div id="itensResultados"></div>
    <div class="resumo-final" id="resumoFinal"></div>
  </div>
</main>

<footer>
  <span>Jean Vieira &middot; jean.vieira@hotmail.com</span>
  <a href="https://github.com/jeanvieir4/conversor-extrato-pdf-excel-ofx" target="_blank" rel="noopener">apoiar / código-fonte</a>
</footer>

<script>
  let arquivosSelecionados = [];

  const dropzone = document.getElementById('dropzone');
  const listaArquivos = document.getElementById('listaArquivos');
  const itensArquivos = document.getElementById('itensArquivos');
  const contagemArquivos = document.getElementById('contagemArquivos');
  const btnConverter = document.getElementById('btnConverter');
  const btnLimpar = document.getElementById('btnLimpar');
  const processando = document.getElementById('processando');
  const resultados = document.getElementById('resultados');
  const itensResultados = document.getElementById('itensResultados');
  const resumoFinal = document.getElementById('resumoFinal');

  function nomeBase(caminho){
    return caminho.split(/[\\/]/).pop();
  }

  function atualizarLista(){
    if (arquivosSelecionados.length === 0){
      listaArquivos.hidden = true;
      btnConverter.disabled = true;
      return;
    }
    listaArquivos.hidden = false;
    btnConverter.disabled = false;
    contagemArquivos.textContent = arquivosSelecionados.length + ' arquivo(s)';
    itensArquivos.innerHTML = '';
    arquivosSelecionados.forEach((caminho, i) => {
      const div = document.createElement('div');
      div.className = 'item-arquivo';
      div.innerHTML = '<span>' + nomeBase(caminho) + '</span>' +
        '<button class="remover" data-i="' + i + '" title="remover">&times;</button>';
      itensArquivos.appendChild(div);
    });
    itensArquivos.querySelectorAll('.remover').forEach(btn => {
      btn.addEventListener('click', () => {
        arquivosSelecionados.splice(parseInt(btn.dataset.i, 10), 1);
        atualizarLista();
      });
    });
  }

  function adicionarArquivos(novos){
    novos.forEach(c => {
      if (c.toLowerCase().endsWith('.pdf') && !arquivosSelecionados.includes(c)){
        arquivosSelecionados.push(c);
      }
    });
    atualizarLista();
  }

  window.addEventListener('pywebviewready', async () => {
    const iniciais = await window.pywebview.api.arquivos_iniciais();
    if (iniciais && iniciais.length){
      adicionarArquivos(iniciais);
    }
  });

  dropzone.addEventListener('click', async () => {
    const escolhidos = await window.pywebview.api.escolher_pdfs();
    if (escolhidos && escolhidos.length){
      adicionarArquivos(escolhidos);
    }
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('dragover');
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const caminhos = [];
    for (const f of e.dataTransfer.files){
      const p = f.pywebviewFullPath || f.path;
      if (p) caminhos.push(p);
    }
    if (caminhos.length){
      adicionarArquivos(caminhos);
    } else {
      alert('Nao consegui ler o caminho do arquivo arrastado. Clique na area pra escolher pelo seletor.');
    }
  });

  btnLimpar.addEventListener('click', () => {
    arquivosSelecionados = [];
    atualizarLista();
    resultados.hidden = true;
  });

  btnConverter.addEventListener('click', async () => {
    btnConverter.disabled = true;
    processando.hidden = false;
    resultados.hidden = true;

    const lista = await window.pywebview.api.converter(arquivosSelecionados);

    processando.hidden = true;
    resultados.hidden = false;
    itensResultados.innerHTML = '';
    let erros = 0;
    lista.forEach(r => {
      const div = document.createElement('div');
      div.className = 'resultado-item';
      if (r.ok){
        div.innerHTML = '<span class="status-pill ok">&#10003;</span>' +
          '<div class="resultado-texto">' +
            '<div class="nome">' + r.arquivo + '</div>' +
            '<div class="detalhe">' + r.lancamentos + ' lancamento(s) &middot; ' +
              r.avisos + ' aviso(s) &middot; ' + r.ofx + ' ofx gerado(s)</div>' +
          '</div>';
      } else {
        erros++;
        div.innerHTML = '<span class="status-pill erro">&times;</span>' +
          '<div class="resultado-texto">' +
            '<div class="nome">' + r.arquivo + '</div>' +
            '<div class="detalhe erro">Erro: ' + r.erro + '</div>' +
          '</div>';
      }
      itensResultados.appendChild(div);
    });
    resumoFinal.textContent = lista.length + ' arquivo(s) processado(s), ' + erros + ' erro(s). Os arquivos .xlsx e .ofx foram gerados na mesma pasta do programa.';
    btnConverter.disabled = false;
  });
</script>

</body>
</html>
